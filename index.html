<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sashka Messenger v3.2</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e; --surface3: #282828;
            --text: #e8e8e8; --text2: #999; --accent: #5b9bd5; --accent2: #4a8ac4;
            --green: #4caf84; --red: #e0555a; --orange: #e8a84c; --purple: #9b59b6;
            --border: #2a2a2a; --radius: 12px; --radius-sm: 8px;
            --shadow: 0 2px 20px rgba(0,0,0,0.6);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --sidebar-width: 320px;
        }
        .light {
            --bg: #f5f5f5; --surface: #fff; --surface2: #f0f0f0; --surface3: #e5e5e5;
            --text: #1a1a1a; --text2: #666; --border: #ddd;
            --shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font); background: #000; color: var(--text);
            height: 100vh; height: 100dvh; overflow: hidden; display: flex;
            align-items: center; justify-content: center;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .app { width: 100vw; height: 100vh; display: flex; background: var(--surface); }
        .sidebar { width: 320px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px; border-bottom: 1px solid var(--border); }
        .sidebar-header h2 { font-size: 1.1rem; margin-bottom: 8px; }
        .search-box { width: 100%; padding: 8px 12px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); outline: none; }
        .chat-tabs { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--surface2); overflow-x: auto; }
        .chat-tab { padding: 5px 10px; border-radius: 14px; border: none; background: transparent; color: var(--text2); cursor: pointer; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
        .chat-tab.active { background: var(--accent); color: #fff; }
        .chat-list { flex: 1; overflow-y: auto; padding: 4px 6px; }
        .chat-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
        .chat-item:hover { background: var(--surface2); }
        .chat-item.active { background: var(--accent); color: #fff; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; background: var(--surface3); }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 600; font-size: 0.85rem; }
        .chat-preview { font-size: 0.7rem; color: var(--text2); }
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
        .main-header { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .messages-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.85rem; }
        .msg.sent { align-self: flex-end; background: var(--accent); color: #fff; }
        .msg.received { align-self: flex-start; background: var(--surface2); }
        .msg.system { align-self: center; background: var(--surface3); color: var(--text2); font-size: 0.7rem; text-align: center; border-radius: 10px; padding: 5px 10px; }
        .input-area { padding: 8px 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
        .input-area textarea { flex: 1; resize: none; border-radius: 18px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); padding: 8px 12px; outline: none; font-family: var(--font); }
        .send-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--accent); color: #fff; cursor: pointer; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; background: var(--accent); color: #fff; font-weight: 600; }
        .btn.ghost { background: var(--surface2); color: var(--text); }
        .btn.danger { background: var(--red); }
        .hidden { display: none !important; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal { background: var(--surface); border-radius: var(--radius); padding: 20px; width: 90%; max-width: 450px; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); margin-bottom: 8px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 16px; font-size: 0.8rem; z-index: 200; }
        .icon-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface2); color: var(--text); cursor: pointer; }
        .badge.creator { background: var(--purple); color: #fff; padding: 2px 6px; border-radius: 8px; font-size: 0.6rem; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; top: 0; bottom: 0; width: 100%; z-index: 10; }
            .sidebar.open { left: 0; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>💬 Sashka Messenger</h2>
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Поиск...">
        </div>
        <div class="chat-tabs" id="chatTabs">
            <button class="chat-tab active" data-filter="all">Все</button>
            <button class="chat-tab" data-filter="private">Личные</button>
            <button class="chat-tab" data-filter="group">Группы</button>
            <button class="chat-tab" data-filter="channel">Каналы</button>
            <button class="chat-tab" data-filter="system">Системные</button>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div style="padding:6px;border-top:1px solid var(--border);display:flex;gap:4px;">
            <button class="icon-btn" id="btnNewChat">➕</button>
            <button class="icon-btn" id="btnDiscover">🔍</button>
            <button class="icon-btn" id="btnProfile">👤</button>
            <button class="icon-btn" id="btnAdmin" style="display:none;">⚙️</button>
            <button class="icon-btn" id="btnTheme">🌓</button>
        </div>
    </div>
    <div class="main" id="mainPanel">
        <div class="main-header">
            <button class="back-btn icon-btn" id="btnBack" style="display:none;">←</button>
            <div class="main-header-info"><div class="name" id="mainName">Выберите чат</div></div>
            <button class="icon-btn" id="btnAttach">📎</button>
        </div>
        <div class="messages-area" id="messagesArea"><div style="text-align:center;color:var(--text2);margin-top:40px;">💬<br>Выберите чат</div></div>
        <div class="input-area" id="inputArea" style="display:none;">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
            <button class="send-btn" id="btnSend">➤</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="loginModal">
    <div class="modal">
        <h3>🔐 Вход</h3>
        <input type="text" id="loginName" placeholder="Логин">
        <input type="password" id="loginPass" placeholder="Пароль">
        <button class="btn" id="btnLogin">Войти</button>
    </div>
</div>
<div class="modal-overlay hidden" id="createChatModal"><div class="modal" id="createChatContent"></div></div>
<div class="modal-overlay hidden" id="profileModal"><div class="modal" id="profileContent"></div></div>
<div class="modal-overlay hidden" id="adminModal"><div class="modal" id="adminContent"></div></div>
<div class="modal-overlay hidden" id="discoverModal"><div class="modal" id="discoverContent"></div></div>
<div class="modal-overlay hidden" id="chatInfoModal"><div class="modal" id="chatInfoContent"></div></div>
<div class="modal-overlay hidden" id="confirmModal"><div class="modal" id="confirmContent"></div></div>
<input type="file" id="fileInput" accept="*" style="display:none;">
<div class="toast hidden" id="toast"></div>

<script>
(function() {
    const LS = 'sm_';
    function L(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d;}catch(e){return d;}}
    function S(k,v){localStorage.setItem(LS+k,JSON.stringify(v));}
    function guid(){return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
    function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
    const $=s=>document.querySelector(s);

    let users=L('users',[]);
    let chats=L('chats',[]);
    let allMessages=L('messages',{});
    let currentUser=L('currentUser',null);
    let currentChatId=L('currentChatId',null);
    let theme=L('theme','dark');
    const SYSTEM_CHAT_ID='system';
    const ADMIN_NAME='sashka1999in2359';
    const ADMIN_PASS='Master_302';
    let activeTab='all';

    async function sha256(m){const b=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}

    function save(){S('users',users);S('chats',chats);S('messages',allMessages);S('currentUser',currentUser);S('currentChatId',currentChatId);S('theme',theme);}

    async function initAdmin(){
        const h=await sha256(ADMIN_PASS);
        if(!users.find(u=>u.name===ADMIN_NAME)) users.unshift({id:'admin_0',name:ADMIN_NAME,passwordHash:h,avatar:null,description:'Админ',blocked:false,isAdmin:true,online:false,allowDM:false});
        if(!chats.find(c=>c.id==='system')){chats.push({id:'system',type:'system',name:'SashkaMessenger',members:[],creatorId:'admin_0'});allMessages['system']=[];}
        if(!chats.find(c=>c.id==='suggest')){chats.push({id:'suggest',type:'suggest',name:'Предложка',members:[],creatorId:'admin_0'});allMessages['suggest']=[];}
        save();
    }

    function getChatName(c){
        if(!c)return'';if(c.type==='system')return'SashkaMessenger';if(c.type==='suggest')return'Предложка';
        if(c.type==='private'){const p=c.members?.find(m=>m!==currentUser?.id);const u=users.find(u=>u.id===p);return u?u.name:'Неизвестный';}
        return c.name||'Без названия';
    }

    function isAdmin(c){return c&&currentUser&&(c.adminIds?.includes(currentUser.id)||c.creatorId===currentUser.id);}
    function isCreator(c){return c&&currentUser&&c.creatorId===currentUser.id;}

    function renderAll(){
        renderChatList();renderMessages();
        if(currentUser){$('#btnAdmin').style.display=currentUser.isAdmin?'flex':'none';$('#loginModal').classList.add('hidden');}
        else $('#loginModal').classList.remove('hidden');
    }

    function renderChatList(){
        const c=$('#chatList');
        if(!currentUser){c.innerHTML='';return;}
        let my=chats.filter(ch=>ch.type==='system'||ch.type==='suggest'||ch.members?.includes(currentUser.id));
        if(activeTab!=='all')my=my.filter(ch=>ch.type===activeTab);
        c.innerHTML=my.map(ch=>{
            const msgs=allMessages[ch.id]||[];const last=msgs[msgs.length-1];
            const prev=last?(last.file?'📎':last.text||''):'Нет сообщений';
            return`<div class="chat-item${ch.id===currentChatId?' active':''}" data-id="${ch.id}">
                <div class="chat-avatar">${ch.type==='system'?'📋':ch.type==='suggest'?'💡':ch.type==='group'?'👥':ch.type==='channel'?'📢':'💬'}</div>
                <div class="chat-info"><div class="chat-name">${esc(getChatName(ch))}${isCreator(ch)?' <span class="badge creator">Создатель</span>':''}</div><div class="chat-preview">${esc(prev)}</div></div>
            </div>`;
        }).join('');
        c.querySelectorAll('.chat-item').forEach(el=>el.onclick=()=>{currentChatId=el.dataset.id;save();renderAll();});
    }

    function renderMessages(){
        const a=$('#messagesArea');
        if(!currentChatId){a.innerHTML='<div style="text-align:center;color:var(--text2);margin-top:40px;">💬<br>Выберите чат</div>';$('#inputArea').style.display='none';$('#mainName').textContent='Выберите чат';return;}
        const chat=chats.find(c=>c.id===currentChatId);
        if(!chat){currentChatId=null;save();renderAll();return;}
        $('#mainName').textContent=getChatName(chat);$('#inputArea').style.display='flex';
        let msgs=allMessages[currentChatId]||[];
        if(chat.type==='suggest'&&!currentUser?.isAdmin)msgs=msgs.filter(m=>m.fromId===currentUser.id||m.system);
        a.innerHTML=msgs.map(m=>{
            const cls=m.system?'system':(m.fromId===currentUser?.id?'sent':'received');
            return`<div class="msg ${cls}"><b style="font-size:0.7rem;">${esc(m.from||'')}</b><div>${esc(m.text||'')}${m.file?`<br><img src="${m.file}" style="max-width:150px;border-radius:8px;">`:''}</div></div>`;
        }).join('');
        a.scrollTop=a.scrollHeight;
    }

    function sendMessage(text,file){
        if(!currentChatId||!currentUser)return;
        const chat=chats.find(c=>c.id===currentChatId);
        if(!chat)return;
        const msg={id:guid(),from:currentUser.name,fromId:currentUser.id,text:text||'',file:file||null,time:Date.now(),system:false};
        if(!allMessages[currentChatId])allMessages[currentChatId]=[];
        allMessages[currentChatId].push(msg);
        if(chat.type==='suggest'&&text){allMessages[currentChatId].push({id:guid(),from:'SashkaMessenger',fromId:'system',text:'Спасибо за предложение!',time:Date.now(),system:true});}
        save();renderAll();
    }

    async function createChat(type,name,password,membersStr=''){
        if(!currentUser)return;
        if(type==='private'){
            const target=users.find(u=>u.name===name);if(!target)return showToast('Пользователь не найден');
            const exist=chats.find(c=>c.type==='private'&&c.members?.includes(currentUser.id)&&c.members?.includes(target.id));
            if(exist){currentChatId=exist.id;save();renderAll();return;}
            const cid='priv_'+[currentUser.id,target.id].sort().join('_');
            chats.push({id:cid,type:'private',members:[currentUser.id,target.id]});allMessages[cid]=[];
        }else if(type==='group'){
            if(!name||!password)return showToast('Имя и пароль обязательны');
            const ph=await sha256(password);
            if(chats.find(c=>c.type==='group'&&c.name===name&&c.passwordHash===ph))return showToast('Группа с таким именем и паролем уже есть');
            const cid='group_'+Date.now();const members=[currentUser.id];
            if(membersStr)membersStr.split(',').map(s=>s.trim()).forEach(n=>{const u=users.find(u=>u.name===n);if(u&&!members.includes(u.id))members.push(u.id);});
            chats.push({id:cid,type:'group',name,passwordHash:ph,members,creatorId:currentUser.id,adminIds:[currentUser.id]});allMessages[cid]=[];
        }else if(type==='channel'){
            if(!name)return showToast('Имя обязательно');
            const cid='channel_'+Date.now();const members=[currentUser.id];
            if(membersStr)membersStr.split(',').map(s=>s.trim()).forEach(n=>{const u=users.find(u=>u.name===n);if(u&&!members.includes(u.id))members.push(u.id);});
            chats.push({id:cid,type:'channel',name,members,creatorId:currentUser.id,adminIds:[currentUser.id]});allMessages[cid]=[];
        }
        currentChatId=chats[chats.length-1].id;save();renderAll();showToast('Чат создан!');
    }

    function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2000);}

    $('#btnLogin').onclick=async()=>{
        const n=$('#loginName').value.trim(),p=$('#loginPass').value;if(!n||!p)return;
        const h=await sha256(p);let u=users.find(u=>u.name===n&&u.passwordHash===h);
        if(!u){if(users.find(u=>u.name===n))return showToast('Имя занято');u={id:'user_'+Date.now(),name:n,passwordHash:h,isAdmin:false,online:true,allowDM:true};users.push(u);}
        else{if(u.blocked)return showToast('Заблокированы');u.online=true;}
        currentUser=u;save();renderAll();showToast('Добро пожаловать, '+n+'!');
    };
    $('#btnSend').onclick=()=>{const t=$('#msgInput').value.trim();if(t){sendMessage(t);$('#msgInput').value='';}};
    $('#msgInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#btnSend').click();}};
    $('#btnNewChat').onclick=()=>{
        $('#createChatContent').innerHTML=`<h3>➕ Создать</h3><select id="chatType"><option value="private">Личное</option><option value="group">Группа</option><option value="channel">Канал</option></select><div id="chatFields"></div><button class="btn" id="btnCreateChat">Создать</button><button class="btn ghost" id="btnCancelCreate">Отмена</button>`;
        $('#createChatModal').classList.remove('hidden');
        function upd(){const t=$('#chatType').value;$('#chatFields').innerHTML=t==='private'?'<input id="targetName" placeholder="Имя">':'<input id="chatName" placeholder="Название">'+(t==='group'?'<input type="password" id="chatPass" placeholder="Пароль">':'')+'<input id="chatMembers" placeholder="Имена через запятую">';}
        $('#chatType').onchange=upd;upd();
        $('#btnCreateChat').onclick=async()=>{
            const t=$('#chatType').value;
            if(t==='private')await createChat('private',$('#targetName').value.trim());
            else{const nm=$('#chatName').value.trim();const mem=$('#chatMembers').value.trim();
                if(t==='group')await createChat('group',nm,$('#chatPass').value,mem);
                else await createChat('channel',nm,null,mem);}
            $('#createChatModal').classList.add('hidden');
        };
        $('#btnCancelCreate').onclick=()=>$('#createChatModal').classList.add('hidden');
    };
    $('#btnDiscover').onclick=()=>{
        $('#discoverContent').innerHTML=`<h3>🔍 Найти</h3><input id="discoverSearch" placeholder="Поиск..."><div id="discoverResults"></div><button class="btn ghost" id="btnCloseDiscover">Закрыть</button>`;
        $('#discoverModal').classList.remove('hidden');
        $('#discoverSearch').oninput=function(){
            const q=this.value.toLowerCase();
            const found=chats.filter(c=>(c.type==='group'||c.type==='channel')&&(c.name||'').toLowerCase().includes(q));
            $('#discoverResults').innerHTML=found.map(c=>`<div>${c.type==='group'?'👥':'📢'} ${esc(c.name)} <button class="btn small join-btn" data-id="${c.id}" data-type="${c.type}">Войти</button></div>`).join('');
            document.querySelectorAll('.join-btn').forEach(b=>b.onclick=()=>{
                if(b.dataset.type==='group'){const p=prompt('Пароль:');if(p){const chat=chats.find(c=>c.id===b.dataset.id);if(chat){sha256(p).then(h=>{if(chat.passwordHash===h){chat.members.push(currentUser.id);currentChatId=chat.id;save();renderAll();$('#discoverModal').classList.add('hidden');}else showToast('Неверный пароль');});}}}
                else{const chat=chats.find(c=>c.id===b.dataset.id);if(chat){chat.members.push(currentUser.id);currentChatId=chat.id;save();renderAll();$('#discoverModal').classList.add('hidden');}}
            });
        };
        $('#btnCloseDiscover').onclick=()=>$('#discoverModal').classList.add('hidden');
    };
    $('#btnProfile').onclick=()=>{
        if(!currentUser)return;
        $('#profileContent').innerHTML=`<h3>👤 Профиль</h3><p><b>Имя:</b> ${esc(currentUser.name)}</p><textarea id="profDesc">${esc(currentUser.description||'')}</textarea><input type="password" id="profPass" placeholder="Новый пароль"><button class="btn" id="btnSaveProf">Сохранить</button><button class="btn ghost" id="btnLogout">🚪 Выйти</button>`;
        $('#profileModal').classList.remove('hidden');
        $('#btnSaveProf').onclick=async()=>{
            currentUser.description=$('#profDesc').value.trim();
            const np=$('#profPass').value;if(np)currentUser.passwordHash=await sha256(np);
            save();$('#profileModal').classList.add('hidden');showToast('Профиль обновлён');
        };
        $('#btnLogout').onclick=()=>{currentUser=null;currentChatId=null;save();renderAll();$('#profileModal').classList.add('hidden');};
    };
    $('#btnAdmin').onclick=()=>{
        if(!currentUser?.isAdmin)return;
        $('#adminContent').innerHTML=`<h3>⚙️ Админ</h3><input id="broadcastText" placeholder="Рассылка"><button class="btn" id="btnBroadcast">📨 Отправить</button>`;
        $('#adminModal').classList.remove('hidden');
        $('#btnBroadcast').onclick=()=>{const t=$('#broadcastText').value.trim();if(t){if(!allMessages['system'])allMessages['system']=[];allMessages['system'].push({id:guid(),from:'SashkaMessenger',fromId:'system',text:t,time:Date.now(),system:true});save();renderAll();$('#adminModal').classList.add('hidden');showToast('Рассылка отправлена');}};
    };
    $('#btnAttach').onclick=()=>$('#fileInput').click();
    $('#fileInput').onchange=()=>{const f=$('#fileInput').files[0];if(f){const rd=new FileReader();rd.onload=()=>sendMessage(null,rd.result);rd.readAsDataURL(f);$('#fileInput').value='';}};
    $('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.body.classList.toggle('light',theme==='light');save();};
    $('#searchInput').oninput=()=>renderChatList();
    $('#btnBack').onclick=()=>$('#sidebar').classList.toggle('open');
    $('#chatTabs').onclick=e=>{if(e.target.classList.contains('chat-tab')){document.querySelectorAll('.chat-tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');activeTab=e.target.dataset.filter;renderAll();}};

    initAdmin();
    document.body.classList.toggle('light',theme==='light');
    if(currentUser)renderAll();
    else $('#loginModal').classList.remove('hidden');
})();
</script>
</body>
</html>
